<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link do Comando Rádio</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 32px 20px; background: #0e0e11; color: #f5f5f7; max-width: 500px; margin: 0 auto; }
        h2 { font-size: 26px; letter-spacing: -0.02em; }
        .link { width: 100%; padding: 14px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a2a32; background: #202027; color: #fff; font-size: 15px; text-align: center; }
        button { display: block; width: 100%; margin: 12px 0; padding: 16px; font-size: 17px; border-radius: 999px; border: none; font-weight: bold; cursor: pointer; }
        .copy { background: #912d19; color: #fff; }
        .share { background: #2b2b33; color: #f5f5f7; }
        #msg { min-height: 1.5em; color: #3ccf7a; }
        .note { font-size: 13px; color: #a5a5b0; }
    </style>
</head>
<body>
    <h2>Comando da Rádio</h2>
    <p>Envia este link a quem quiseres que controle a rádio:</p>
    <input class="link" id="link" type="text" value="__URL__" readonly onclick="this.select()">
    <button class="copy" onclick="copiar()">Copiar link</button>
    <button class="share" id="share" onclick="partilhar()" hidden>Partilhar…</button>
    <p id="msg"></p>
    <p class="note">O link muda sempre que a rádio é reiniciada. Quem tiver o link consegue controlar a rádio.</p>
    <script>
        var link = document.getElementById("link");
        var msg = document.getElementById("msg");
        if (navigator.share) document.getElementById("share").hidden = false;

        function copiar() {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(link.value).then(copiado, copiarAntigo);
            } else {
                copiarAntigo();
            }
        }
        function copiarAntigo() {
            link.select();
            try { document.execCommand("copy"); copiado(); }
            catch (e) { msg.textContent = "Não foi possível copiar. Seleciona o link e copia à mão."; }
        }
        function copiado() { msg.textContent = "Link copiado!"; }
        function partilhar() {
            navigator.share({ title: "Comando da Rádio", url: link.value }).catch(function () {});
        }
    </script>
</body>
</html>
