music_directory     "~/storage/shared/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"

# Só no próprio telemóvel: a app e o mpc ligam a localhost, e aberto à rede local
# qualquer pessoa no mesmo Wi-Fi controlava o MPD sem passar pela app (até o kill)
bind_to_address     "127.0.0.1"
port                "6600"
restore_paused      "yes"

audio_output {
    type            "sles"
    name            "Android OpenSLES"
    mixer_type      "software"
}
