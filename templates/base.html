<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Comando Rádio{% endblock %}</title>
    {# Opcional: sem ele a página funciona na mesma, com formulários e redirects #}
    <script src="{{ asset_url('app.js') }}" defer></script>
    {# Marca a página como tendo JavaScript logo no início, para os esqueletos das imagens só aparecerem com ele #}

    <link rel="stylesheet" href="{{ asset_url('style.css') }}">
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
